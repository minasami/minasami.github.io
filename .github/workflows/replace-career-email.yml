name: Replace career email

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace old Gmail address
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old = "jesussavedmina@gmail.com"
          new = "minasamitawfiksaad@gmail.com"
          changed = []
          skip_dirs = {".git", ".github"}
          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except Exception:
                  continue
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  changed.append(str(path))
          print("updated", len(changed), "files")
          for item in changed:
              print(item)
          PY

      - name: Commit and push if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No remaining email replacements."
            exit 0
          fi
          git commit -m "Replace public email with minasamitawfiksaad@gmail.com"
          git push
